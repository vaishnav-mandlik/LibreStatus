apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// No react-native-vector-icons font copy: the app draws every glyph itself
// from src/components/icons.tsx, and an architecture test forbids importing
// the library. Bundling its four TTFs only grew the APK.

// Load keystore properties for release signing
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mandlik.statussaverpro"
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.1.0"
    }

    // One codebase, two stores. The code is identical; only the application
    // id differs, because a store ties an app to its id forever and the two
    // listings were created under different ones.
    //   fdroid -> F-Droid builds this from source and signs it itself
    //   play   -> the signed bundle uploaded to Google Play
    flavorDimensions "store"
    productFlavors {
        fdroid {
            dimension "store"
            applicationId "com.vaishnavmandlik.librestatus"
        }
        play {
            dimension "store"
            applicationId "com.mandlik.statussaverpro"
        }
    }

    // True when this invocation is building an app bundle for Play. Play splits
    // an .aab by ABI itself, and AGP refuses to build one from a project that
    // is also producing per-ABI APKs ("Multiple shrunk-resources files found"),
    // so the split only applies to the APKs we sideload.
    def buildingBundle = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains("bundle")
    }

    splits {
        abi {
            reset()
            // One APK per ABI (no universal APK) so each download is smaller.
            enable !buildingBundle
            universalApk false
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    // Give each per-ABI APK a unique version code, because a store will not
    // accept two APKs sharing one. The ABI digit goes in the lowest position
    // so codes order as armeabi-v7a < arm64-v8a < x86 < x86_64. A bundle has
    // one output and must keep the plain versionCode, which is what Play
    // reads, so this is skipped there.
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiName = output.getFilter(com.android.build.OutputFile.ABI)
            def abiVersionCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86": 3, "x86_64": 4]
            def abiCode = abiVersionCodes.get(abiName)
            if (abiCode != null) {
                output.versionCodeOverride = variant.versionCode * 10 + abiCode
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Configuration must succeed even with no keystore, or debug
                // builds break too. The real guard runs at execution time
                // below, so a release can still never be silently debug-signed.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            /*
             * The plain config, not "proguard-android-optimize.txt". This
             * looks like free money and is not, so it is worth writing down.
             *
             * The two files differ by one line: the optimizing variant drops
             * -dontoptimize and lets R8 inline, merge classes and prune
             * branches. Measured here it took the dex from 6.34 MB to 4.38 MB,
             * a 31% cut shipped to every user. It also made the app die on
             * launch:
             *
             *   ClassNotFoundException:
             *     com.facebook.react.devsupport.CxxInspectorPackagerConnection
             *   at OpenSourceMergedSoMapping.libreact_devsupportjni_so
             *
             * React Native's JNI resolves that class by string name at .so
             * load time. No Java code references it, so to the optimizer it is
             * unreachable and class merging is free to make the name stop
             * existing. Shrinking alone never hit this, which is why the plain
             * config has always worked.
             *
             * A -keep rule fixes that one class. The problem is the rest: the
             * crash is only the first FindClass on the startup path, and every
             * other one in React Native and in each library is the same shape,
             * invisible to the optimizer and to any build-time check. Proving
             * that set complete means exercising every code path in a release
             * build, and the cost of being wrong is a crash that no debug
             * build reproduces. That is a bad trade for 2 MB when Play already
             * splits the download per device.
             */
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Shrink resources to reduce APK size
            shrinkResources true
        }
    }
}

/*
 * Fail an actual release assembly when there is no keystore — but only then.
 * Throwing from the signingConfigs block instead would run at configuration
 * time and break `assembleDebug`, which is how this was first written.
 */
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any {
        it.project == project && it.name ==~ /(?i)(assemble|bundle|install|package)play.*release.*/
    }
    // Only the Play flavor is guarded. F-Droid builds the fdroid flavor on its
    // own servers with no keystore at all and signs the APK itself.
    if (buildingRelease && !keystorePropertiesFile.exists()
            && !project.hasProperty('allowDebugSigningForRelease')) {
        throw new GradleException(
                'android/keystore.properties is missing, so the release build cannot be signed. ' +
                'Create it with storeFile/storePassword/keyAlias/keyPassword, or pass ' +
                '-PallowDebugSigningForRelease to deliberately build an undistributable debug-signed APK.')
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // DocumentFile for SAF
    implementation "androidx.documentfile:documentfile:1.0.1"
    // FileProvider for the share cache (Repost hands files to WhatsApp directly).
    implementation "androidx.core:core:1.13.1"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
