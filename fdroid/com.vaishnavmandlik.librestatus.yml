Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 4766eca01c13dbc0b3835ae78df66c0357c938a3
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - B=https://github.com/adoptium/temurin17-binaries/releases/download
      - F=jdk-17.0.19%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.19_10.tar.gz
      - J=/usr/lib/jvm/java-17-openjdk-amd64
      - H=d8afc263758141a66e0e3aafc321e783f7016696f4eaea067d340a269037d331
      - curl -Lo /tmp/jdk17.tar.gz "$B/$F"
      - echo "$H  /tmp/jdk17.tar.gz" | sha256sum -c -
      - mkdir -p "$J"
      - tar xzf /tmp/jdk17.tar.gz --strip-components=1 -C "$J"
      - rm /tmp/jdk17.tar.gz
    init: npm ci
    gradle:
      - yes
    rm:
      - ios
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/fb-dotslash/bin/linux-musl.x86_64/dotslash
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-video/android/build.gradle
      - node_modules/react-native-share/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-permissions/android/build.gradle
      - node_modules/react-native-localize/android/build.gradle
      - node_modules/react-native-linear-gradient/android/build.gradle
      - node_modules/@react-native-camera-roll/camera-roll/android/build.gradle
      - node_modules/react-native-vector-icons/android/build.gradle
    scandelete:
      - node_modules/react-native/React
      - node_modules/react-native/sdks/hermesc/osx-bin
      - node_modules/react-native/sdks/hermesc/win64-bin
      - node_modules/fb-dotslash/bin/macos
      - node_modules/fb-dotslash/bin/windows
      - node_modules/fb-dotslash/bin/linux-musl.aarch64

AutoUpdateMode: Version
UpdateCheckMode: Tags
